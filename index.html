<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="游戏资讯排行榜站 - 本周热门榜/Steam热销/独立佳作/3A大作/国产游戏/手游排行/网游榜/复古怀旧，应有尽有" />
  <title>GameRank · 游戏资讯排行榜站</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo" id="logo-home">
        <span class="logo-icon">🎮</span>
        <span class="logo-text">Game<em>Rank</em></span>
      </div>

      <div class="search-wrap">
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="搜索游戏名 / 开发商 / 发行商 / 类型标签..."
          autocomplete="off"
        />
        <button class="search-btn" aria-label="搜索">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </div>

      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" title="切换明暗主题" aria-label="切换主题">
          <span class="theme-icon-dark">🌙</span>
          <span class="theme-icon-light">☀️</span>
        </button>
        <button id="fav-btn" class="icon-btn fav-btn" title="我的收藏夹" aria-label="收藏夹">
          <span>❤️</span>
          <span id="fav-count" class="fav-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="container main-content">

    <!-- 榜单Tab 8类 -->
    <section class="tabs-section">
      <div class="tabs-heading">
        <span>📊 榜单类型</span>
      </div>
      <div class="tabs-scroll">
        <div class="tabs list-tab" id="list-tabs">
          <button class="tab active" data-list="weekly">🔥 本周热门榜</button>
          <button class="tab" data-list="steam">💨 Steam热销</button>
          <button class="tab" data-list="indie">✨ 独立佳作</button>
          <button class="tab" data-list="aaa">💎 3A大作</button>
          <button class="tab" data-list="chinese">🇨🇳 国产游戏</button>
          <button class="tab" data-list="mobile">📱 手游排行</button>
          <button class="tab" data-list="online">🌐 网游榜</button>
          <button class="tab" data-list="retro">👾 复古怀旧</button>
        </div>
      </div>
    </section>

    <!-- 平台Tab 6类 + 类型Tab 9类 + 排序 -->
    <section class="filter-bar">
      <div class="filter-row">
        <span class="filter-label">🎯 平台：</span>
        <div class="tabs platform-tab" id="platform-tabs">
          <button class="mini-tab active" data-platform="all">全部</button>
          <button class="mini-tab" data-platform="pc">PC</button>
          <button class="mini-tab" data-platform="ps5">PS5</button>
          <button class="mini-tab" data-platform="xbox">Xbox</button>
          <button class="mini-tab" data-platform="switch">Switch</button>
          <button class="mini-tab" data-platform="mobile">手游</button>
          <button class="mini-tab" data-platform="multi">多平台</button>
        </div>
      </div>

      <div class="filter-row">
        <span class="filter-label">🏷️ 类型：</span>
        <div class="tabs genre-tab" id="genre-tabs">
          <button class="mini-tab active" data-genre="all">全部</button>
          <button class="mini-tab" data-genre="动作">动作</button>
          <button class="mini-tab" data-genre="冒险">冒险</button>
          <button class="mini-tab" data-genre="RPG">RPG</button>
          <button class="mini-tab" data-genre="策略">策略</button>
          <button class="mini-tab" data-genre="射击">射击</button>
          <button class="mini-tab" data-genre="模拟">模拟</button>
          <button class="mini-tab" data-genre="竞速">竞速</button>
          <button class="mini-tab" data-genre="解谜">解谜</button>
          <button class="mini-tab" data-genre="卡牌">卡牌</button>
        </div>
      </div>

      <div class="filter-row sort-row">
        <span class="filter-label">📈 排序：</span>
        <div class="sort-tabs" id="sort-tabs">
          <button class="mini-tab sort-tab active" data-sort="hot">🔥 热度</button>
          <button class="mini-tab sort-tab" data-sort="rating">⭐ 评分</button>
          <button class="mini-tab sort-tab" data-sort="date">📅 发售日</button>
        </div>
        <div class="filter-tip">
          共找到 <span id="result-count">0</span> 款游戏
        </div>
      </div>
    </section>

    <!-- 游戏卡片网格 -->
    <section id="game-grid" class="game-grid">
      <!-- 加载状态 -->
      <div id="loading-state" class="empty-state">
        <div class="spinner"></div>
        <p>正在加载游戏数据...</p>
      </div>
    </section>

    <!-- 空状态（在网格后面用JS切换显示） -->
    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">🔍</div>
      <h3>没有找到匹配的游戏</h3>
      <p>试试调整筛选条件或搜索其他关键词吧~</p>
    </div>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2025 GameRank · 游戏资讯排行榜站 · 纯前端演示项目</p>
      <p class="footer-sub">数据仅供展示，图片来自 Picsum Photos</p>
    </div>
  </footer>

  <!-- ============ BACK TO TOP ============ -->
  <button id="back-to-top" class="back-to-top" title="回到顶部" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <!-- ============ MODAL ============ -->
  <div id="game-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-mask" data-close="true"></div>
    <div class="modal-dialog">
      <button class="modal-close" data-close="true" aria-label="关闭">&times;</button>
      <div id="modal-content" class="modal-content">
        <!-- 动态内容 -->
      </div>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toast" class="toast"></div>

  <script src="./js/app.js"></script>
</body>
</html>
